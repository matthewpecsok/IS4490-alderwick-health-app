{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page.has_previous %}<a href="{% querystring page=page.previous_page_number %}">&larr; Previous</a>{% endif %}
  <span class="current">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a href="{% querystring page=page.next_page_number %}">Next &rarr;</a>{% endif %}
</nav>
{% endif %}
